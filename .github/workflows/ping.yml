name: ping

on:
  schedule:
    # Every 6 hours. GitHub may delay scheduled runs under load.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check sites
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/ping.sh

      # Scheduled workflows are disabled after 60 days without repository
      # activity. This commit keeps the repository active.
      - name: Heartbeat
        if: always()
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > last-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add last-run.txt
          git diff --staged --quiet && exit 0
          git commit -m 'chore: heartbeat'
          git push || (git pull --rebase && git push)
